name: validate-skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate skill copies and documentation
        run: python3 scripts/validate_codex_plugin_layout.py

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
