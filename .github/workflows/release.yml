name: release-core-skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate tag and repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$RELEASE_TAG" != "v${package_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package.json version ${package_version}" >&2
            exit 1
          fi
          python3 scripts/sync_plugins.py --check
          python3 scripts/validate_codex_plugin_layout.py
          python3 -m unittest discover -s tests -v

      - name: Build core Skill release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          version="${RELEASE_TAG#v}"
          public_base="${TOS_PUBLIC_BASE_URL:-https://cloudcache.volccdn.com}"
          prefix="${TOS_PREFIX:-ve/skills}"
          python3 scripts/build_release_bundle.py \
            --version "$version" \
            --cdn-base-url "${public_base%/}/${prefix#/}" \
            --output-dir dist

      - name: Publish GitHub release fallback
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: |
            dist/manifest.json
            dist/volcengine-skill-bundle.zip

      - name: Install AWS CLI
        run: |
          python3 -m pip install --user --upgrade awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload versioned release to TOS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_ACCESS_KEY }}
          AWS_MAX_ATTEMPTS: '2'
          AWS_CLI_CONNECT_TIMEOUT: '10'
          AWS_CLI_READ_TIMEOUT: '60'
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_BUCKET: ${{ vars.TOS_BUCKET }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
          TOS_REGION: ${{ vars.TOS_REGION }}
          TOS_S3_ENDPOINT: ${{ vars.TOS_S3_ENDPOINT }}
        run: |
          : "${AWS_ACCESS_KEY_ID:?missing secret TOS_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?missing secret TOS_SECRET_ACCESS_KEY}"

          version="${RELEASE_TAG#v}"
          export AWS_DEFAULT_REGION="${TOS_REGION:-cn-beijing}"
          bucket="${TOS_BUCKET:-eps-common-public}"
          prefix="${TOS_PREFIX:-ve/skills}"
          endpoint="${TOS_S3_ENDPOINT:-https://tos-s3-cn-beijing.volces.com}"
          aws configure set default.s3.addressing_style virtual
          aws --endpoint-url "$endpoint" s3 cp \
            dist/volcengine-skill-bundle.zip \
            "s3://${bucket}/${prefix}/v${version}/volcengine-skill-bundle.zip"
          aws --endpoint-url "$endpoint" s3 cp \
            dist/cdn-manifest.json \
            "s3://${bucket}/${prefix}/v${version}/manifest.json" \
            --content-type application/json
          aws --endpoint-url "$endpoint" s3 ls \
            "s3://${bucket}/${prefix}/v${version}/" --recursive

      - name: Verify public versioned release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          version="${RELEASE_TAG#v}"
          public_base="${TOS_PUBLIC_BASE_URL:-https://cloudcache.volccdn.com}"
          prefix="${TOS_PREFIX:-ve/skills}"
          release_base="${public_base%/}/${prefix#/}/v${version}"
          curl --fail --location --retry 5 "$release_base/manifest.json" -o published-manifest.json
          curl --fail --location --retry 5 "$release_base/volcengine-skill-bundle.zip" -o published-bundle.zip
          python3 - <<'PY'
          import hashlib
          import json
          expected = json.load(open("published-manifest.json"))["bundle"]["sha256"]
          actual = hashlib.sha256(open("published-bundle.zip", "rb").read()).hexdigest()
          if actual != expected:
              raise SystemExit("published bundle sha256 mismatch")
          PY

      - name: Publish latest manifest last
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TOS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TOS_SECRET_ACCESS_KEY }}
          TOS_BUCKET: ${{ vars.TOS_BUCKET }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
          TOS_REGION: ${{ vars.TOS_REGION }}
          TOS_S3_ENDPOINT: ${{ vars.TOS_S3_ENDPOINT }}
        run: |
          export AWS_DEFAULT_REGION="${TOS_REGION:-cn-beijing}"
          bucket="${TOS_BUCKET:-eps-common-public}"
          prefix="${TOS_PREFIX:-ve/skills}"
          endpoint="${TOS_S3_ENDPOINT:-https://tos-s3-cn-beijing.volces.com}"
          aws configure set default.s3.addressing_style virtual
          aws --endpoint-url "$endpoint" s3 cp \
            dist/cdn-manifest.json \
            "s3://${bucket}/${prefix}/latest/manifest.json" \
            --content-type application/json \
            --cache-control 'no-cache, max-age=0'

      - name: Refresh CDN release pointers
        env:
          VOLCENGINE_ACCESS_KEY: ${{ secrets.VOLCENGINE_ACCESS_KEY }}
          VOLCENGINE_SECRET_KEY: ${{ secrets.VOLCENGINE_SECRET_KEY }}
          VOLCENGINE_REGION: ${{ vars.VOLCENGINE_REGION }}
          VOLCENGINE_CLI_SKIP_SKILLS: '1'
          TOS_PUBLIC_BASE_URL: ${{ vars.TOS_PUBLIC_BASE_URL }}
          TOS_PREFIX: ${{ vars.TOS_PREFIX }}
        run: |
          : "${VOLCENGINE_ACCESS_KEY:?missing secret VOLCENGINE_ACCESS_KEY}"
          : "${VOLCENGINE_SECRET_KEY:?missing secret VOLCENGINE_SECRET_KEY}"
          : "${VOLCENGINE_REGION:?missing variable VOLCENGINE_REGION}"

          public_base="${TOS_PUBLIC_BASE_URL:-https://cloudcache.volccdn.com}"
          prefix="${TOS_PREFIX:-ve/skills}"
          refresh_url="${public_base%/}/${prefix#/}/latest/manifest.json"
          npm install -g "@volcengine/cli@1.1.5"
          ve cdn SubmitRefreshTask \
            --Type file \
            --UrlList.1 "$refresh_url"
